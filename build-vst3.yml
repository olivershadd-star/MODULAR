name: VST3 Windows
on:
  workflow_dispatch:
  push:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4
      - name: Compiler avec JUCE 8 et executer les tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildScript = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter Construire_Windows.ps1 | Select-Object -First 1
          if (-not $buildScript) { throw 'Construire_Windows.ps1 absent du depot.' }
          & $buildScript.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Compilation ou tests en echec.' }
          $projectPath = $buildScript.DirectoryName
          $pluginPath = Join-Path $projectPath 'build-win/Modular_artefacts/Release/VST3'
          $stagePath = Join-Path $env:RUNNER_TEMP 'Modular_1_4_Alpha_2'
          New-Item -ItemType Directory -Force $stagePath | Out-Null
          Copy-Item -Path "$pluginPath/*.vst3" -Destination $stagePath -Recurse
          $standalonePath = Join-Path $projectPath 'build-win/Modular_artefacts/Release/Standalone'
          $appPath = Join-Path $stagePath 'Standalone'
          New-Item -ItemType Directory -Force $appPath | Out-Null
          Copy-Item -Path "$standalonePath/*.exe" -Destination $appPath
          Copy-Item -Path (Join-Path $projectPath 'INSTALLATION.txt') -Destination $stagePath
          Copy-Item -Path (Join-Path $projectPath 'README.md') -Destination $stagePath
          $diagnosticsPath = Join-Path $stagePath 'Diagnostics'
          New-Item -ItemType Directory -Force $diagnosticsPath | Out-Null
          Copy-Item -Path (Join-Path $projectPath 'build-win/Release/bench_audio.exe') -Destination $diagnosticsPath
          Copy-Item -Path (Join-Path $projectPath 'tools/Mesurer_Performances.cmd') -Destination $diagnosticsPath
          Copy-Item -Path (Join-Path $projectPath 'docs/DIAGNOSTIC_WINDOWS.txt') -Destination $diagnosticsPath
          $deliveryPath = Join-Path $env:GITHUB_WORKSPACE 'Livraison'
          New-Item -ItemType Directory -Force $deliveryPath | Out-Null
          Compress-Archive -Path "$stagePath/*" -DestinationPath "$deliveryPath/Modular_V1_4_Alpha_2_Windows.zip"
      - name: Apercu pour verification visuelle
        shell: pwsh
        run: |
          $preview = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'Modular-preview.png' | Select-Object -First 1
          Write-Host 'MODULAR_UI_PNG_BASE64_START'
          Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes($preview.FullName)))
          Write-Host 'MODULAR_UI_PNG_BASE64_END'
      - name: Telecharger le VST3
        uses: actions/upload-artifact@v4
        with:
          name: Modular-V1-4-Alpha-2-Windows
          path: Livraison/*.zip
          if-no-files-found: error
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANKS-Tests
          path: '**/build-win/Testing/Temporary/*.log'
          if-no-files-found: ignore
      - name: Mesures audio par bloc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modular-Audio-Performance-V1-4-Alpha-2
          path: '**/build-win/performance.csv'
          if-no-files-found: ignore

      - name: Apercus interface Modular
        uses: actions/upload-artifact@v4
        with:
          name: Modular-Interface-V1-4-Alpha-2
          path: '**/build-win/Modular-preview*.png'
          if-no-files-found: error
