name: VST3 Windows
on:
  workflow_dispatch:
  push:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - name: Recuperer les sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lire le numéro de version
        id: version
        shell: pwsh
        run: |
          $match = Select-String -Path CMakeLists.txt -Pattern 'project\([A-Za-z0-9_]+ VERSION ([0-9.]+)'
          $version = $match.Matches[0].Groups[1].Value
          $exists = git tag --list "v$version"
          $publish = (-not $exists) -and ('${{ github.event_name }}' -ne 'pull_request') -and ('${{ github.ref }}' -eq 'refs/heads/main')
          "version=$version" >> $env:GITHUB_OUTPUT
          "publish=$($publish.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          Write-Host "Version $version - publication : $publish"
      - name: Compiler avec JUCE 8 et executer les tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildScript = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter Construire_Windows.ps1 | Select-Object -First 1
          if (-not $buildScript) { throw 'Construire_Windows.ps1 absent du depot.' }
          & $buildScript.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Compilation ou tests en echec.' }
          $projectPath = $buildScript.DirectoryName
          $pluginPath = Join-Path $projectPath 'build-win/Modular_artefacts/Release/VST3'
          $stagePath = Join-Path $env:RUNNER_TEMP "MODULAR-Windows-x64-${{ steps.version.outputs.version }}"
          New-Item -ItemType Directory -Force $stagePath | Out-Null
          Copy-Item -Path "$pluginPath/*.vst3" -Destination $stagePath -Recurse
          $standalonePath = Join-Path $projectPath 'build-win/Modular_artefacts/Release/Standalone'
          $appPath = Join-Path $stagePath 'Standalone'
          New-Item -ItemType Directory -Force $appPath | Out-Null
          Copy-Item -Path "$standalonePath/*.exe" -Destination $appPath
          Copy-Item -Path (Join-Path $projectPath 'INSTALLATION.txt') -Destination $stagePath
          Copy-Item -Path (Join-Path $projectPath 'README.md') -Destination $stagePath
          $diagnosticsPath = Join-Path $stagePath 'Diagnostics'
          New-Item -ItemType Directory -Force $diagnosticsPath | Out-Null
          Copy-Item -Path (Join-Path $projectPath 'build-win/Release/bench_audio.exe') -Destination $diagnosticsPath
          Copy-Item -Path (Join-Path $projectPath 'tools/Mesurer_Performances.cmd') -Destination $diagnosticsPath
          Copy-Item -Path (Join-Path $projectPath 'docs/DIAGNOSTIC_WINDOWS.txt') -Destination $diagnosticsPath
          $deliveryPath = Join-Path $env:GITHUB_WORKSPACE 'Livraison'
          New-Item -ItemType Directory -Force $deliveryPath | Out-Null
          Compress-Archive -Path "$stagePath" -DestinationPath "$deliveryPath/MODULAR-Windows-x64-${{ steps.version.outputs.version }}.zip"
      - name: Apercu pour verification visuelle
        shell: pwsh
        run: |
          $preview = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter 'Modular-preview.png' | Select-Object -First 1
          Write-Host 'MODULAR_UI_PNG_BASE64_START'
          Write-Host ([Convert]::ToBase64String([IO.File]::ReadAllBytes($preview.FullName)))
          Write-Host 'MODULAR_UI_PNG_BASE64_END'
      - name: Telecharger le VST3
        uses: actions/upload-artifact@v4
        with:
          name: Modular-V1-4-Alpha-3-Windows
          path: Livraison/*.zip
          if-no-files-found: error
      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ANKS-Tests
          path: '**/build-win/Testing/Temporary/*.log'
          if-no-files-found: ignore
      - name: Mesures audio par bloc
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Modular-Audio-Performance-V1-4-Alpha-3
          path: '**/build-win/performance.csv'
          if-no-files-found: ignore

      - name: Apercus interface Modular
        uses: actions/upload-artifact@v4
        with:
          name: Modular-Interface-V1-4-Alpha-3
          path: '**/build-win/Modular-preview*.png'
          if-no-files-found: error

      - name: Publier la version (onglet Releases)
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: MODULAR ${{ steps.version.outputs.version }}
          prerelease: true
          files: Livraison/*.zip
          body: |
            **MODULAR — synthèse hybride / laboratoire DSP — ANKS Labs, gratuit.** Version de test : à essayer, pas encore une version finale.

            1. Télécharge `MODULAR-Windows-x64-${{ steps.version.outputs.version }}.zip` ci-dessous (rubrique *Assets*) et fais clic droit → **Extraire tout**.
            2. **Plugin pour Ableton** : copie le dossier `Modular.vst3` dans `C:\Program Files\Common Files\VST3`.
            3. Dans Live : **Préférences → Plug-ins → Dossier système VST3 = On**, puis **Relancer l'analyse**. Le plugin apparaît sous **Plug-ins**.
            4. **Sans Ableton** : lance `Standalone\Modular.exe`. Aucune installation.

            Dans le ZIP, le VST3 est à la racine du dossier et l'application dans `Standalone`. Le dossier `Diagnostics` sert à mesurer les performances.

            *Windows peut afficher « Windows a protégé votre ordinateur » : Informations complémentaires → Exécuter quand même (programme gratuit non signé).*

            **EN —** Download `MODULAR-Windows-x64-${{ steps.version.outputs.version }}.zip`, extract it and copy `Modular.vst3` to `C:\Program Files\Common Files\VST3`, then rescan plug-ins in your DAW. Or run `Standalone\Modular.exe` standalone.
